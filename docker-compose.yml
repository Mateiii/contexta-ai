services:

  backend:
    build: ./backend
    container_name: flask_backend
    ports:
      - "5000:5000"

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: gemma3:12b

    volumes:
      - ./backend/uploads:/backend/uploads
      - ./backend/data:/backend/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama

    ports:
      - "11435:11434"

    volumes:
      - ollama:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh

    entrypoint:
      - /bin/sh
      - /entrypoint.sh

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  ollama:
